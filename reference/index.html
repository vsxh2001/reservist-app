<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservist · Commander Dashboard</title>
  <link rel="stylesheet" href="styles.css">

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
          crossorigin="anonymous"></script>

  <!-- Data first, then UI atoms, then screens, then app -->
  <script src="data.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="sidebar.jsx"></script>
  <script type="text/babel" src="roster.jsx"></script>
  <script type="text/babel" src="drawer.jsx"></script>
  <script type="text/babel" src="modal.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>

  <style>
    /* The outer page: park the app inside a centered frame so it feels like
       a real desktop window without forcing a fixed canvas. */
    html, body { background: #2A241A; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .stage {
      width: min(100%, 1440px);
      height: min(calc(100vh - 40px), 900px);
      min-height: 720px;
      border-radius: 14px;
      overflow: hidden;
      background: var(--paper-deep, #E8DFC9);
      box-shadow: 0 30px 90px -20px rgba(0,0,0,.55), 0 8px 24px -8px rgba(0,0,0,.35);
      position: relative;
    }
    #root {
      width: 100%; height: 100%;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div id="root"></div>
  </div>

  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
